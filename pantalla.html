<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantalla · Circuito ODS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23A9C719'><path d='M13 2 3 14h9l-1 8 10-12h-9l1-8z'/></svg>">
<link rel="stylesheet" href="css/estilo.css">
<style>
  .lobby-equipos { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .lobby-equipos .e { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--borde); font-family: var(--display); font-weight: 700; animation: subir .4s; }
  #qr img, #qr canvas { border-radius: 12px; background: #fff; padding: 10px; }
  .fs-btn { position: fixed; top: 10px; right: 10px; z-index: 100; opacity: .25; }
  .fs-btn:hover { opacity: 1; }
</style>
</head>
<body class="pantalla">
<button class="btn chico fs-btn no-print" id="fs" title="Pantalla completa">⛶</button>
<div id="root" class="pantalla-grid"></div>
<div id="overlay"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/datos.js"></script>
<script src="js/comun.js"></script>
<script src="js/pantalla.js"></script>
</body>
</html>
